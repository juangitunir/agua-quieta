<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" font-family="Georgia, serif">
  <rect width="800" height="440" fill="#fffaf0"/>
  <text x="40" y="45" font-size="20" fill="#2b2a26">Tamaño adulto aproximado</text>
  <!-- regla: 60 cm = 680 px -->
  <g stroke="#9a907b" stroke-width="1">
    <path d="M60 395 H740"/>
    <path d="M60 387 V403 M173 390 V400 M287 387 V403 M400 390 V400 M513 387 V403 M627 390 V400 M740 387 V403"/>
  </g>
  <g font-size="12" fill="#5f5b50" text-anchor="middle">
    <text x="60" y="420">0</text><text x="287" y="420">20 cm</text><text x="513" y="420">40 cm</text><text x="740" y="420">60 cm</text>
  </g>

  <!-- carpín: ~22 cm -->
  <g transform="translate(60 90)">
    <path d="M0 40 C 40 0 160 0 210 30 L 250 5 L 245 40 L 250 75 L 210 50 C 160 80 40 80 0 40Z" fill="#e8892b"/>
    <path d="M90 14 q 30 -25 60 -5" fill="#d0731d"/>
    <circle cx="30" cy="34" r="5" fill="#2b2a26"/>
    <text x="280" y="36" font-size="17" fill="#2b2a26">Carpín dorado</text>
    <text x="280" y="56" font-size="13" fill="#5f5b50">20–25 cm · resistente, para empezar</text>
  </g>

  <!-- tenca: ~35 cm -->
  <g transform="translate(60 185)">
    <path d="M0 35 C 60 0 280 -5 350 25 L 400 0 L 392 35 L 400 70 L 350 45 C 280 75 60 70 0 35Z" fill="#6f8a3c"/>
    <path d="M150 8 q 50 -22 90 0" fill="#57702b"/>
    <circle cx="32" cy="30" r="5" fill="#e0b437"/>
    <path d="M6 38 q -8 6 -4 14" stroke="#57702b" stroke-width="2" fill="none"/>
    <text x="425" y="32" font-size="17" fill="#2b2a26">Tenca</text>
    <text x="425" y="52" font-size="13" fill="#5f5b50">30–40 cm · autóctona, de fondo</text>
  </g>

  <!-- koi: ~60 cm -->
  <g transform="translate(60 285)">
    <path d="M0 40 C 90 -5 520 -10 610 30 L 680 0 L 668 40 L 680 80 L 610 50 C 520 90 90 85 0 40Z" fill="#fbf4ea" stroke="#c8402f" stroke-width="2"/>
    <path d="M60 25 q 50 -22 110 -5 q -35 28 -110 5z M440 22 q 50 -18 120 0 q -50 34 -120 0z" fill="#c8402f"/>
    <circle cx="30" cy="34" r="5" fill="#2b2a26"/>
    <path d="M4 44 q -10 6 -6 16" stroke="#c8402f" stroke-width="2" fill="none"/>
    <text x="200" y="38" font-size="17" fill="#2b2a26">Carpa koi</text>
    <text x="200" y="58" font-size="13" fill="#5f5b50">60 cm o más · exigente</text>
  </g>
</svg>
